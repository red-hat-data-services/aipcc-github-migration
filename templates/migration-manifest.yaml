# Migration Manifest — GitLab to GitHub
# Generated by /gitlab-to-github skill
# This file tracks migration state across sessions.

repo: REPO_NAME
source_gitlab: GITLAB_PATH
target_github_org: opendatahub-io
target_github_repo: opendatahub-io/REPO_NAME
quay_org: ""    # populated by Phase 0 if container push detected
quay_repo: ""   # populated by Phase 0 if container push detected
jira_ticket: ""
wave: 1  # 1 (simple/no CI), 2 (real CI), 3 (complex multi-arch/cross-repo)

# Cross-repo CI dependency tracking (future use — populated by Phase 0 but not yet acted on)
includes_from: []   # GitLab projects this repo pulls CI config from
included_by: []     # GitLab projects that include CI config from this repo

# Phase 0 detected state (populated automatically)
detected:
  has_ci: false
  has_container_push: false
  has_multi_arch: false
  has_tekton: false
  has_spec_inputs: false
  has_license: false
  license_type: null
  has_policy_md: false
  github_state: absent  # absent | empty | has_content
  quay_repo_exists: false
  gitlab_self_references: []  # files containing gitlab>REPO_PATH or similar self-referencing patterns
  is_shared_preset: false     # true if repo is consumed by other repos as preset/config/template
  branch_count: 0
  branches_to_delete: []
  branches_to_keep: []
  branches_to_ask: []

maintainers: []  # GitHub usernames — populated at init from team roster

phases:
  cleanup:
    status: pending
    items:
      - { name: "Add POLICY.md", status: pending, type: automatable }
      - { name: "Add LICENSE (Apache-2.0)", status: pending, type: automatable }
      - { name: "Update README", status: pending, type: automatable }
      - { name: "Update GitLab self-references", status: pending, type: automatable }
      - { name: "Commit with Signed-off-by", status: pending, type: automatable }
      - { name: "MR submitted and merged", status: pending, type: human }
  github_setup:
    status: pending
    items:
      - { name: "Repo exists in target org", status: pending, type: human }
      - { name: "Add github remote", status: pending, type: automatable }
      - { name: "Push main to GitHub", status: pending, type: automatable }
  quay_oidc:
    status: pending
    items:
      - { name: "Create Quay repo", status: pending, type: human }
      - { name: "Create org-level robot account", status: pending, type: automatable }
      - { name: "Grant robot write permission", status: pending, type: automatable }
      - { name: "Get numeric subject claim", status: pending, type: human }
      - { name: "Configure robot federation", status: pending, type: human }
      - { name: "Add quay-oidc-login.sh", status: pending, type: automatable }
      - { name: "Verify push succeeds", status: pending, type: automatable }
  ci:
    status: pending
    items:
      - { name: "Create .github/workflows/ci.yml", status: pending, type: automatable }
      - { name: "Create .github/scripts/", status: pending, type: automatable }
      - { name: "Pin actions to SHA", status: pending, type: automatable }
      - { name: "Add dependabot.yml", status: pending, type: automatable }
      - { name: "Scope id-token to push job", status: pending, type: automatable }
      - { name: "Set concurrency groups", status: pending, type: automatable }
      - { name: "Add timeout-minutes", status: pending, type: automatable }
      - { name: "Verify CI passes", status: pending, type: automatable }
  mirroring:
    status: pending
    items:
      - { name: "Enable GitLab pull mirroring", status: pending, type: automatable }
      - { name: "Verify mirror syncs", status: pending, type: automatable }
      - { name: "Confirm downstream includes work", status: pending, type: human }
